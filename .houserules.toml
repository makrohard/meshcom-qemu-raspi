# The house-rules profile of this shell repository, for LoRaHAM Pi Control's tools/check_houserules.py
# (`check_houserules.py <base>..<head>`, run in this repository). The checker reads it at <base>, so a range
# cannot relax its own rules. Attribution, markers and the HARD patterns are the checker's own and apply as
# in every repository.

# The tests: every tests/test-*.sh script is one layer; each `check "..."` or `gate "..."` call is one test.
layers = [["tests/", "runner"]]
test_files = ["test-*.sh"]
test_def = '^\s*(check|gate)\s+"'

# No module budgets: the budget table and the family directory belong to LoRaHAM Pi Control.
budget_file = ""
family_dir = ""

# This repository has no changelog file.
changelog = ""

# In added test lines: a sleep that would decide an outcome (H3), and a network call.
[warn_patterns]
sleep = '(^|[;&|]\s*)sleep\s+[0-9]'
network = '\b(curl|wget)\b'
